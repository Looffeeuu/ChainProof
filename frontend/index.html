<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 必须排在所有 CSS 之前：浏览器在解析样式之前就知道该用什么画布底色，
         否则暗色下会先闪一下白屏（MDN color-scheme 原话：
         prevent unwanted screen flashes during page load） -->
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChainProof：基于区块链的团队贡献存证与验证平台" />

    <!-- 品牌标记：两枚相扣的方块。链式存证的抽象写法，单色，不用外部文件 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232b52d8' stroke-width='2.4' stroke-linejoin='round'%3E%3Crect x='3.2' y='3.2' width='11' height='11' rx='3'/%3E%3Crect x='9.8' y='9.8' width='11' height='11' rx='3'/%3E%3C/svg%3E"
    />

    <title>ChainProof</title>

    <!--
      主题的同步脚本。必须是同步的、必须在首屏绘制之前跑完。

      为什么不能交给 CSS：用户的显式选择存在 localStorage 里，而 CSS 读不到它。
      不写这段的话，页面会先按系统偏好画一遍，脚本加载后再跳到用户选的那个——
      就是那一下闪烁。

      三态：'dark' / 'light' 写成 data-theme 属性；'system' 或没存过就什么都不写，
      交给 tokens.css 里的 prefers-color-scheme 媒体查询处理。
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('chainproof.settings') || '{}')
        if (saved.theme === 'dark' || saved.theme === 'light') {
          document.documentElement.dataset.theme = saved.theme
        }
      } catch (e) {
        /* 隐私窗口里读 localStorage 本身就会抛错。什么都不做，跟随系统 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
